<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hermes</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="app">
      <aside class="sidebar">
        <div class="brand-block">
          <div class="brand">
            <div class="brand-title">Hermes</div>
            <div class="brand-sub">本地助手 · 与 Ink 同源网关</div>
          </div>
          <input
            type="search"
            id="skills-search"
            class="sidebar-search"
            placeholder="搜索已安装技能…"
            autocomplete="off"
            spellcheck="false"
          />
          <button type="button" class="btn btn-cta btn-block" id="btn-new">+ 新建对话</button>
          <button type="button" class="btn btn-ghost btn-block" id="btn-refresh">刷新侧栏</button>
        </div>

        <details class="fold-panel" open>
          <summary class="fold-summary">
            <span class="fold-title">Agent</span>
            <span class="fold-hint muted">模型与运行环境</span>
          </summary>
          <div id="agent-card" class="agent-card muted">等待会话…</div>
        </details>

        <section class="panel skills-panel">
          <div class="section-head">
            <div>
              <h3 class="section-title">已安装技能</h3>
              <p class="section-sub muted">点击卡片可将 /技能名 填入输入框</p>
            </div>
            <span id="skills-count" class="badge"></span>
          </div>
          <div id="skills-filters" class="filter-pills" aria-label="技能分类"></div>
          <div id="skills-list" class="skills-list skill-grid muted">—</div>
        </section>

        <div class="sidebar-foot">
          <span id="conn-pill" class="pill">连接中…</span>
        </div>
      </aside>

      <main class="main">
        <header class="main-topbar">
          <div class="main-topbar-text">
            <h1 class="main-title">对话</h1>
            <p class="main-subtitle muted">连接一切，无所不能</p>
          </div>
          <div class="main-topbar-actions">
            <div class="pills pills-inline" id="quick-pills"></div>
          </div>
        </header>
        <section class="transcript" id="transcript"></section>
        <footer class="composer-wrap">
          <div class="composer">
            <textarea
              id="input"
              rows="3"
              placeholder="输入消息…（Enter 发送，Shift+Enter 换行）"
            ></textarea>
            <div class="composer-actions">
              <span class="hint muted">内容由 AI 生成，请核实重要信息。</span>
              <div class="btns">
                <button type="button" class="btn secondary" id="btn-stop" disabled>
                  停止
                </button>
                <button type="button" class="btn primary" id="btn-send">发送</button>
              </div>
            </div>
          </div>
        </footer>
      </main>

      <aside class="right-rail">
        <section class="rail-section">
          <h3 class="rail-title">工具集</h3>
          <p class="rail-sub muted">当前会话可用的工具分组</p>
          <div id="toolsets-list" class="toolsets-list muted">—</div>
        </section>

        <section class="rail-section">
          <h3 class="rail-title">本回合工具</h3>
          <p class="rail-sub muted">本轮模型调用的工具流水</p>
          <ul id="activity-list" class="activity-list"></ul>
        </section>

        <section class="rail-section">
          <h3 class="rail-title">子 Agent</h3>
          <p class="rail-sub muted">委派与子任务</p>
          <div id="subagent-list" class="compact-list muted">无运行中的子 Agent</div>
        </section>

        <section class="rail-section rail-section-last">
          <h3 class="rail-title">后台进程</h3>
          <p class="rail-sub muted">终端 / 长任务登记</p>
          <div id="bg-procs-list" class="compact-list muted">—</div>
        </section>
      </aside>
    </div>
    <div id="modal" class="modal hidden" role="dialog" aria-modal="true"></div>
    <script src="/app.js"></script>
  </body>
</html>
