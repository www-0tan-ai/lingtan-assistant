<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>Lingtan Assistant</title>
    <style>
      :root {
        color-scheme: dark;
      }
      html, body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: #1a1a1a;
        color: #e6e6e6;
        font-family: -apple-system, "Segoe UI", "PingFang SC",
          "Microsoft YaHei", Roboto, system-ui, sans-serif;
        overflow: hidden;
        user-select: none;
        -webkit-user-select: none;
        -webkit-app-region: drag;
      }
      .wrap {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100%;
        gap: 18px;
        padding: 24px;
        text-align: center;
      }
      .logo {
        width: 56px;
        height: 56px;
        border-radius: 14px;
        background: linear-gradient(135deg, #4f8cff 0%, #8c5bff 100%);
        display: grid;
        place-items: center;
        font-weight: 700;
        font-size: 26px;
        letter-spacing: 1px;
        color: #fff;
        box-shadow: 0 8px 24px rgba(79, 140, 255, 0.25);
      }
      h1 {
        margin: 0;
        font-size: 18px;
        font-weight: 600;
        letter-spacing: 0.5px;
      }
      p {
        margin: 0;
        font-size: 13px;
        color: #9aa0a6;
      }
      .bar {
        width: 220px;
        height: 3px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.08);
        overflow: hidden;
        position: relative;
      }
      .bar::after {
        content: "";
        position: absolute;
        inset: 0;
        width: 40%;
        background: linear-gradient(90deg, transparent, #4f8cff, transparent);
        animation: slide 1.4s ease-in-out infinite;
      }
      @keyframes slide {
        0%   { transform: translateX(-100%); }
        100% { transform: translateX(350%); }
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="logo">L</div>
      <h1>Lingtan Assistant</h1>
      <p>正在启动本地服务,请稍候…</p>
      <div class="bar" aria-hidden="true"></div>
    </div>
  </body>
</html>
