# Lingtan desktop seed — copied into packaged hermes-home when `npm run seed` runs.
# Main chat: DeepSeek direct API. Set DEEPSEEK_API_KEY in ~/.hermes/.env (bundled as secrets.enc).
# Model IDs: deepseek-v4-pro | deepseek-v4-flash | deepseek-chat | deepseek-reasoner
# (see hermes_cli/model_normalize.py).
model:
  provider: deepseek
  default: deepseek-v4-pro

onboarding:
  seen:
    busy_input_prompt: true
    openclaw_residue_cleanup: true
