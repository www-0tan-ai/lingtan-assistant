# Windows portable EXE + bundled PyInstaller sidecar (run from repo root via scripts/build_windows_electron_desktop.ps1).
appId: com.0tan.desktop
productName: 0tan
copyright: Copyright 0tan contributors
icon: build/icon.png

directories:
  output: ../dist-electron-pack

# Main process only in asar; static UI + Python sidecar live in extraResources (real paths).
files:
  - main.cjs
  - package.json

asar: true

extraResources:
  - from: renderer
    to: renderer
  - from: ../dist/hermes-electron-sidecar
    to: sidecar
  - from: build/icon.png
    to: app-icon.png

win:
  # 避免在未启用 Windows 开发者模式时解压 winCodeSign 内 darwin 符号链接失败（无 symlink 权限）
  signAndEditExecutable: false
  signDlls: false
  target:
    - target: portable
      arch:
        - x64
  artifactName: 0tan-${version}-portable.exe

compression: normal
