<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hermes</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="app">
      <aside class="sidebar">
        <div class="brand">
          <div class="brand-title">Hermes</div>
          <div class="brand-sub">Electron · 本地助手</div>
        </div>

        <section class="panel agent-panel">
          <h3 class="panel-title">Agent</h3>
          <div id="agent-card" class="agent-card muted">等待会话…</div>
        </section>

        <section class="panel skills-panel">
          <div class="panel-head">
            <h3 class="panel-title">Skills</h3>
            <span id="skills-count" class="badge"></span>
          </div>
          <div id="skills-list" class="skills-list muted">—</div>
        </section>

        <div class="sidebar-actions">
          <button type="button" class="btn secondary btn-block" id="btn-new">新对话</button>
          <button type="button" class="btn secondary btn-block" id="btn-refresh">刷新侧栏</button>
        </div>
        <div class="sidebar-foot">
          <span id="conn-pill" class="pill">连接中…</span>
        </div>
      </aside>

      <main class="main">
        <header class="hero">
          <h1>连接一切，无所不能</h1>
          <p class="muted">与 Ink / Dashboard 共用 tui_gateway · 仅本机回环</p>
          <div class="pills" id="quick-pills"></div>
        </header>
        <section class="transcript" id="transcript"></section>
        <footer class="composer-wrap">
          <div class="composer">
            <textarea
              id="input"
              rows="3"
              placeholder="输入消息…（Enter 发送，Shift+Enter 换行）"
            ></textarea>
            <div class="composer-actions">
              <span class="hint muted">内容由 AI 生成，请核实重要信息。</span>
              <div class="btns">
                <button type="button" class="btn secondary" id="btn-stop" disabled>
                  停止
                </button>
                <button type="button" class="btn primary" id="btn-send">发送</button>
              </div>
            </div>
          </div>
        </footer>
      </main>

      <aside class="right-rail">
        <section class="panel">
          <h3 class="panel-title">工具集</h3>
          <p class="panel-hint muted">当前会话启用的工具集与工具名</p>
          <div id="toolsets-list" class="toolsets-list muted">—</div>
        </section>

        <section class="panel">
          <h3 class="panel-title">本回合工具</h3>
          <ul id="activity-list" class="activity-list"></ul>
        </section>

        <section class="panel">
          <h3 class="panel-title">子 Agent</h3>
          <div id="subagent-list" class="compact-list muted">无运行中的子 Agent</div>
        </section>

        <section class="panel">
          <h3 class="panel-title">后台进程</h3>
          <div id="bg-procs-list" class="compact-list muted">—</div>
        </section>
      </aside>
    </div>
    <div id="modal" class="modal hidden" role="dialog" aria-modal="true"></div>
    <script src="/app.js"></script>
  </body>
</html>
